name: ApiDoc
on:
  workflow_dispatch:
  merge_group:
  pull_request:
    branches: [ dev/**, release/** ]
    paths:
      - .github/workflows/api_doc.yml
      - api/**
  push:
    branches: [ refactoring ]
    paths:
      - .github/workflows/api_doc.yml
      - api/**

jobs:
  CheckApiDoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew

      - name: Check doc
        run: ./gradlew api:dokkaGenerateHtml

      - uses: actions/upload-artifact@v4
        with:
          name: api-doc
          path: api/build/dokka/html
          if-no-files-found: error
          overwrite: true

  DeployReviewApiDoc:
    runs-on: ubuntu-latest
    needs: CheckApiDoc
    # Fork and Dependabot runs do not receive the Vercel repository secret.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    permissions:
      pull-requests: write
    concurrency:
      group: api-doc-preview-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
    defaults:
      run:
        shell: bash
    env:
      PREVIEW_DIRECTORY: api-doc-preview
      VERCEL_SCOPE: nightfishs-projects
      VERCEL_PROJECT: lightnovelreader-api-doc

    steps:
      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Download the generated documentation
        uses: actions/download-artifact@v4
        with:
          name: api-doc
          path: ${{ runner.temp }}/${{ env.PREVIEW_DIRECTORY }}/.vercel/output/static

      - name: Deploy API docs to Vercel Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          preview_dir="$RUNNER_TEMP/$PREVIEW_DIRECTORY"
          output_dir="$preview_dir/.vercel/output"
          if [[ ! -f "$output_dir/static/index.html" ]]; then
            echo 'The documentation artifact is missing index.html.'
            exit 1
          fi
          printf '{"version":3}\n' > "$output_dir/config.json"

          vercel link --cwd "$preview_dir" --yes --scope "$VERCEL_SCOPE" \
            --project "$VERCEL_PROJECT" --token "$VERCEL_TOKEN"
          vercel project protection disable "$VERCEL_PROJECT" --sso \
            --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" --non-interactive
          preview_url=$(vercel deploy --cwd "$preview_dir" --prebuilt --archive=tgz --yes --token "$VERCEL_TOKEN")
          if [[ ! "$preview_url" =~ ^https://[a-zA-Z0-9.-]+\.vercel\.app$ ]]; then
            echo 'Vercel did not return a preview URL.'
            exit 1
          fi

          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          printf '[API documentation preview](%s)\n' "$preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Add or update the preview link on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          marker='<!-- api-doc-preview -->'
          comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
          comment_id=$(gh api --paginate "$comments?per_page=100" |
            jq -sr --arg marker "$marker" '[.[][] | select(.user.login == "github-actions[bot]")
              | select(.body | startswith($marker))] | first | .id // empty')

          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! jq -e --arg sha "$HEAD_SHA" --arg base "$BASE_REF" \
            '.state == "open" and .head.sha == $sha and .base.ref == $base' <<< "$pr" > /dev/null; then
            echo "Pull request #$PR_NUMBER changed while deploying."
            exit 0
          fi

          body=$(printf '%s\n[API documentation preview](%s) for `%s`.\n' "$marker" "$PREVIEW_URL" "${HEAD_SHA:0:7}")
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api --method POST "$comments" -f body="$body" > /dev/null
          fi

  DeployProductionApiDoc:
    runs-on: ubuntu-latest
    needs: CheckApiDoc
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: npm install -g vercel

      - uses: actions/download-artifact@v4
        with:
          name: api-doc
          path: lightnovelreader-api-doc

      - name: Set Vercel project
        run: npx vercel link --yes --scope nightfishs-projects --project lightnovelreader-api-doc --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: npx vercel deploy lightnovelreader-api-doc --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
